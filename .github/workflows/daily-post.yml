name: Daily post

# 02:30 UTC is 08:15 in Kathmandu (UTC+5:45). GitHub's scheduler is best
# effort and runs late under load, so treat the time as "early morning",
# not as a deadline.
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate the post but do not publish it'
        type: boolean
        default: false
      topic:
        description: 'Write about this instead of the next queued topic'
        type: string
        required: false
      status:
        description: 'Create the post as'
        type: choice
        options: [published, draft]
        default: published

# Two runs writing to posted.json at once would fight over the same commit.
concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only to commit automation/posted.json back

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r automation/requirements.txt

      - name: Write and publish
        env:
          BLOG_API_BASE: ${{ secrets.BLOG_API_BASE }}
          BLOG_EMAIL: ${{ secrets.BLOG_EMAIL }}
          BLOG_PASSWORD: ${{ secrets.BLOG_PASSWORD }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          # Neither of these is sensitive, so they belong on the Variables tab
          # -- but `vars.` and `secrets.` are separate stores and a name added
          # to the wrong one reads as empty rather than as an error. Accept
          # both, so whichever tab they were typed into, the job finds them.
          BLOG_SITE_URL: ${{ vars.BLOG_SITE_URL || secrets.BLOG_SITE_URL }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL || secrets.NVIDIA_MODEL }}
          # Dispatch inputs reach the script through the environment, never
          # through the command line: a topic is free text, and interpolating
          # it into `run:` would let it run as shell.
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          POST_STATUS: ${{ inputs.status || 'published' }}
        run: |
          args=()
          if [ "$INPUT_DRY_RUN" = 'true' ]; then args+=(--dry-run); fi
          if [ -n "$INPUT_TOPIC" ];        then args+=(--topic "$INPUT_TOPIC"); fi
          python automation/daily_post.py "${args[@]}"

      - name: Record what was posted
        if: success() && !inputs.dry_run
        run: |
          # Nothing to do when the topic came from the workflow input and the
          # file did not change.
          if git diff --quiet automation/posted.json; then
            echo 'No state change to commit.'
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add automation/posted.json
          git commit -m 'chore(automation): record daily post [skip ci]'
          git push
